name: CI

on:
  push:
    branches:
      - main

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            -t denning01/kubernetes-anator-backend:$IMAGE_TAG \
            -t denning01/kubernetes-anator-backend:latest \
            ./backend

      - name: Push Docker images
        run: |
          docker push denning01/kubernetes-anator-backend:$IMAGE_TAG
          docker push denning01/kubernetes-anator-backend:latest